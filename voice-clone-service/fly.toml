# Isolated CPU voice-clone app. Scale-to-zero: no machine runs when idle; the proxy starts one on the next request.
# Deliberately NOT co-located with piper-tts-sjc / realtime-tts-gateway (cloning would starve live TTS) or the Modal STT worker.
app = "listenai-voice-clone"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "120s"

[build]
  dockerfile = "Dockerfile"

[env]
  VC_MODEL = "turbo"
  VC_DATA_DIR = "/data"
  VC_MAX_CONCURRENT = "1"
  VC_MAX_QUEUE = "4"
  VC_DAILY_GEN_SECONDS = "3600"

[[mounts]]
  source = "vcdata"
  destination = "/data"
  initial_size = "3gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 2
    hard_limit = 6

  # Runs on the machine itself (not through the proxy), so it does not count as traffic and cannot keep the machine awake.
  [[http_service.checks]]
    grace_period = "150s"
    interval = "60s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "performance-8x"
  memory = "16gb"

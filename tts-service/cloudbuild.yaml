steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/readaloud-tts:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/readaloud-tts:latest', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/readaloud-tts:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/readaloud-tts:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'readaloud-tts'
      - '--image=gcr.io/$PROJECT_ID/readaloud-tts:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=8Gi'
      - '--cpu=4'
      - '--timeout=300'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--concurrency=10'
      - '--set-env-vars=CACHE_ENABLED=true,LOG_LEVEL=INFO'

images:
  - 'gcr.io/$PROJECT_ID/readaloud-tts:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/readaloud-tts:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '3600s'  # 1 hour timeout for large model download


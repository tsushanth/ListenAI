# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Removed 2026-08-03: android.defaults.buildfeatures.buildconfig — this
# global default flag was removed in AGP 9.0 (build fails if present).
# Not needed anyway: only :app actually uses BuildConfig, and it already
# sets buildFeatures.buildConfig = true explicitly in its own module.
# paywallkit/crosspromokit/ratingkit don't reference BuildConfig at all.

# AGP 9's built-in Kotlin support conflicts with the explicit
# org.jetbrains.kotlin.android plugin still applied by the shared library
# modules (PaywallKit/RatingKit/CrossPromoKit-Android) — those repos are
# also used by 7 other apps (RiddleVerse, VibeBuild, ScribeAI, etc.) still
# on AGP 8.x, so their plugin blocks can't be changed without breaking
# those apps' builds. Opting out here lets ReadAloudAI get AGP 9 + API 36
# without forcing a synchronized migration across the whole portfolio
# tonight. NOTE: this opt-out is removed in AGP 10.0 (mid-2026) — the
# shared libraries need this same migration eventually, just not tonight.
android.builtInKotlin=false
# Same reasoning as above — the old org.jetbrains.kotlin.android plugin
# also isn't compatible with AGP 9's new DSL (default-on). Needed together
# with builtInKotlin=false for the shared-library compatibility bridge.
android.newDsl=false

# 16KB page alignment (required for Android 15 / targetSdk 35)
android.config.pageSize=16384
